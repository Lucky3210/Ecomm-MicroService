spring.application.name=ApiGateway
server.port=8080

# EUREKA CONFIG
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# increase logging level of the Api gateway application
logging.level.root=INFO
logging.level.org.springframework.cloud.gateway.route.RouteDefinitionLocator=INFO
logging.level.org.springframework.cloud.gateway=TRACE


# PRODUCT SERVICE ROUTE
# whenever we receive a request with a Path predicate as /api/product
# it will route it to lb://ProductService
spring.cloud.gateway.routes[0].id=product-service
spring.cloud.gateway.routes[0].uri=lb://ProductService
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/product


# ORDER SERVICE ROUTE
# whenever we receive a request with a Path predicate as /api/order
# it will route it to lb://OrderService
spring.cloud.gateway.routes[1].id=order-service
spring.cloud.gateway.routes[1].uri=lb://OrderService
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/order


# INVENTORY SERVICE ROUTE
# whenever we receive a request with a Path predicate as /api/inventory
# it will route it to lb://InventoryService
spring.cloud.gateway.routes[2].id=inventory-service
spring.cloud.gateway.routes[2].uri=lb://InventoryService
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/inventory


# DISCOVERY SERVER ROUTE
# whenever we receive a request with a Path predicate as /eureka/web it will filter
# the request and set the path to / implying that it will route it to
# lb://localhost:8761
spring.cloud.gateway.routes[3].id=discovery-server
spring.cloud.gateway.routes[3].uri=http://localhost:8761
spring.cloud.gateway.routes[3].predicates[0]=Path=/eureka/web
spring.cloud.gateway.routes[3].filters[0]=SetPath=/

# DISCOVERY SERVER STATIC RESOURCES ROUTE
spring.cloud.gateway.routes[4].id=discovery-server
spring.cloud.gateway.routes[4].uri=http://localhost:8761
spring.cloud.gateway.routes[4].predicates[0]=Path=/eureka/**


# KEYCLOAK CONFIG
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8181/realms/ShoppingMS

