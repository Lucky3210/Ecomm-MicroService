spring.application.name=ProductService

#server.port=5050
server.port=0

# MONGODB Configuration (matches your Docker Compose)
spring.data.mongodb.uri=mongodb://sourcec:source@127.0.0.1:27017/product-service?authSource=admin
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=product-service
spring.data.mongodb.username=sourcec
spring.data.mongodb.password=source
# spring.data.mongodb.authentication-database=admin  # Required for root user

# EUREKA CONFIG
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# MICROMETER OBSERVABILITY CONFIG
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# All traces should be sent to latency analysis tool
management.tracing.sampling.probability=1.0
management.endpoints.web.exposure.include=prometheus

# For Exemplars to work we need histogram buckets
management.metrics.distribution.percentiles-histogram.http.server.requests=true
