spring.application.name=InventoryService

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3308/inventory-service
spring.datasource.username=source
spring.datasource.password=source
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect


# server.port = 5052
# To run on any port
server.port = 0

# EUREKA CONFIG
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka

# MICROMETER OBSERVABILITY CONFIG
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# All traces should be sent to latency analysis tool
management.tracing.sampling.probability=1.0
management.endpoints.web.exposure.include=prometheus

# For Exemplars to work we need histogram buckets
management.metrics.distribution.percentiles-histogram.http.server.requests=true
